# Quando carichi un tag tipo v0.2.7:
# 1. GitHub accende un computer Windows
# 2. fa partire i test automatici (se uno fallisce, la release non esce)
# 3. compila l'app in C# con la versione del tag (0.2.7)
# 4. crea BatterieInBarra-0.2.7.exe (l'app da aprire) e BatterieInBarra-Setup-0.2.7.exe (l'installer)
# 5. crea la release "Batterie in Barra 0.2.7" con le novità di docs/CHANGELOG.md
# Si può far partire anche a mano da Actions -> "Crea la release" -> "Run workflow" (usa l'ultimo tag).

name: Crea la release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # La versione viene dal tag (v0.2.7 -> 0.2.7)
      - name: Prendi la versione dal tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag=$(git describe --tags --abbrev=0)
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSIONE=${tag#v}" >> "$GITHUB_ENV"

      - name: Test automatici
        run: dotnet test Test/BatterieInBarra.Test.csproj -c Release

      - name: Crea l'exe
        run: |
          dotnet publish BatterieInBarra.csproj -c Release -r win-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:Version=$VERSIONE \
            -o uscita
          cp uscita/BatterieInBarra.exe "BatterieInBarra-$VERSIONE.exe"

      - name: Crea l'installer
        run: |
          choco install innosetup -y --no-progress
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" installer.iss
          ls uscita-installer

      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Novità: la sezione "## <versione>" di docs/CHANGELOG.md
          awk -v h="## $VERSIONE " 'index($0, h) == 1 { f = 1; next } /^## / { if (f) exit } f' docs/CHANGELOG.md > notes.md || true
          if [ ! -s notes.md ]; then
            echo "Versione $VERSIONE di Batterie in Barra." > notes.md
          fi

          # Le foto: solo quelle scritte nella sezione della versione (es. ![...](immagini/lingua.png)).
          # Nel CHANGELOG il percorso è "immagini/...": qui lo trasformiamo nell'indirizzo completo su GitHub
          foto="https://raw.githubusercontent.com/${{ github.repository }}/$TAG/docs/immagini/"
          sed -i "s#](immagini/#]($foto#g" notes.md

          app="BatterieInBarra-$VERSIONE.exe"
          installer="uscita-installer/BatterieInBarra-Setup-$VERSIONE.exe"

          # Prima l'app, POI l'installer: le versioni vecchie dell'app prendono il primo .exe della lista
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$app" --clobber
            gh release edit "$TAG" --draft=false --title "Batterie in Barra $VERSIONE" --notes-file notes.md
          else
            gh release create "$TAG" "$app" --title "Batterie in Barra $VERSIONE" --notes-file notes.md
          fi
          gh release upload "$TAG" "$installer" --clobber
