# Quando carichi un tag tipo v0.2.0:
# 1. GitHub accende un computer Windows
# 2. compila l'app in C# con la versione del tag (0.2.0)
# 3. crea un solo file BatterieInBarra-0.2.0.exe (non serve installare niente)
# 4. crea la release "Batterie in Barra 0.2.0" con le novità di docs/CHANGELOG.md
# Si può far partire anche a mano da Actions -> "Crea la release" -> "Run workflow" (usa l'ultimo tag).

name: Crea la release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # La versione viene dal tag (v0.2.0 -> 0.2.0)
      - name: Prendi la versione dal tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag=$(git describe --tags --abbrev=0)
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSIONE=${tag#v}" >> "$GITHUB_ENV"

      - name: Crea l'exe
        run: |
          dotnet publish BatterieInBarra.csproj -c Release -r win-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:Version=$VERSIONE \
            -o uscita
          cp uscita/BatterieInBarra.exe "BatterieInBarra-$VERSIONE.exe"

      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Novità: la sezione "## <versione>" di docs/CHANGELOG.md
          awk -v h="## $VERSIONE " 'index($0, h) == 1 { f = 1; next } /^## / { if (f) exit } f' docs/CHANGELOG.md > notes.md || true
          if [ ! -s notes.md ]; then
            echo "Versione $VERSIONE di Batterie in Barra." > notes.md
          fi

          file="BatterieInBarra-$VERSIONE.exe"

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$file" --clobber
            gh release edit "$TAG" --draft=false --title "Batterie in Barra $VERSIONE" --notes-file notes.md
          else
            gh release create "$TAG" "$file" --title "Batterie in Barra $VERSIONE" --notes-file notes.md
          fi
