<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
  <title>Batterie in Barra - Impostazioni</title>
  <link rel="stylesheet" href="impostazioni.css">
</head>
<body>

  <!-- Dispositivi: nome e "sulla barra" -->
  <h2>Dispositivi</h2>
  <div class="scheda" id="dispositivi"></div>

  <!-- Barra -->
  <h2>Barra</h2>
  <div class="scheda">
    <label class="riga">
      <div class="testi">
        <div class="titolo">Mostra la percentuale</div>
        <div class="sotto">Se è spenta vedi solo la batteria: la % compare col mouse</div>
      </div>
      <input type="checkbox" class="interruttore" id="mostraPercentuale">
    </label>
    <div class="separatore"></div>
    <label class="riga">
      <div class="testi">
        <div class="titolo">Animazioni</div>
        <div class="sotto">Dissolvenza quando un dispositivo si collega o si scollega</div>
      </div>
      <input type="checkbox" class="interruttore" id="animazioni">
    </label>
  </div>

  <!-- Avvisi -->
  <h2>Avvisi</h2>
  <div class="scheda">
    <div class="riga">
      <div class="testi">
        <div class="titolo">Batteria scarica sotto il</div>
      </div>
      <div class="scelta" id="soglia">
        <button data-valore="10">10%</button>
        <button data-valore="20">20%</button>
        <button data-valore="30">30%</button>
      </div>
    </div>
    <div class="separatore"></div>
    <label class="riga">
      <div class="testi">
        <div class="titolo">Avvisa quando la carica è completa</div>
        <div class="sotto">Notifica quando un dispositivo torna al 100%</div>
      </div>
      <input type="checkbox" class="interruttore" id="avvisoCompleta">
    </label>
  </div>

  <!-- Generale -->
  <h2>Generale</h2>
  <div class="scheda">
    <label class="riga">
      <div class="testi">
        <div class="titolo">Avvia con Windows</div>
        <div class="sotto">Funziona nella versione installata con il file .exe</div>
      </div>
      <input type="checkbox" class="interruttore" id="avvioWindows">
    </label>
  </div>

  <script src="comune.js"></script>
  <script src="pagina-impostazioni.js"></script>
</body>
</html>
